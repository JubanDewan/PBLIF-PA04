    <div class="container mt-4 mb-5 pb-5"><div class="card shadowc bg-blur mb-4"><div class="card-header"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
<h2 class="font-main-unhover m-0">DATA ORDER</h2><button type="button" class="btn font-main hoverable no-print" data-bs-toggle="modal" data-bs-target="#modalTambahOrder"><i class="fa-solid fa-plus"></i> Tambah Order</button></div></div><div class="card-body"><div class="table-responsive"><table class="table table-bordered order-table mb-0 "><thead class="text-center"><tr><th>No. Order</th><th>Nama Pelanggan</th><th>Jenis Layanan</th><th>Berat (Kg)</th><th>Total Bayar</th><th>Status</th><th>Aksi</th></tr></thead><tbody id="tblBody"></tbody></table></div></div></div></div></div>
<div class="modal fade" id="modalTambahOrder" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content">
<div class="modal-header"><h5 class="modal-title font-main">Tambah</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body"><form id="formData"><div class="row g-3"><div class="col-md-6"><label class="form-label">Nama Pelanggan</label><input id="f_nama" type="text" class="form-control hoverable" required list="dlPelanggan" placeholder="Ketik atau pilih pelanggan"></div><datalist id="dlPelanggan"></datalist><div class="col-md-6"><label class="form-label">Jenis Layanan</label><select id="f_layanan" class="form-select hoverable" required></select></div><div class="col-md-6"><label class="form-label">Berat Cucian (Kg)</label><input id="f_berat" type="number" class="form-control hoverable" required min="0.5" step="0.5"></div><div class="col-md-6"><label class="form-label">Tanggal Masuk</label><input id="f_masuk" type="date" class="form-control hoverable" required></div><div class="col-md-6"><label class="form-label">Estimasi Selesai</label><input id="f_estimasi" type="date" class="form-control hoverable" required></div><div class="col-md-6"><label class="form-label">Status Cucian</label><select id="f_status" class="form-select hoverable" ><option>Menunggu</option><option>Diproses</option><option>Selesai</option><option>Diambil</option></select></div><div class="col-12"><strong>Total bayar: <span id="totalPreview" class="font-main-unhover">Rp0</span></strong></div></div></form></div>
<div class="modal-footer"><button type="button" class="btn btn-cancel font-cancel" data-bs-dismiss="modal">Batal</button>
<button type="submit" form="formData" class="btn font-main btn-success">Simpan</button></div></div></div></div>
