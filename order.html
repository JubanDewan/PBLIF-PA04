    color: rgba(99, 99, 99, 0.877);

<body>

      <a class="navbar-brand font-main fw-bold" href="#">
        <img src="/img/logo-nav.png" alt="logo SJ WASH" class="logo">
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bstarget="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" arialabel="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <form class="d-flex position-absolute top-50 start-50 translate-middle w-50">
        <input id="searchOrder" class="form-control me-3 hoverable-m" type="search"
          placeholder="Cari Order / Pelanggan..." aria-label="Search">

      </form>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link font-main" href="#"><i class="fas fa-bell"></i></a>

              data-bs-toggle="dropdown" ariaexpanded="false">

            <ul class="dropdown-menu dropdown-menu-end" arialabelledby="navbarDropdown">

  <div class="d-flex">
    <div class="sidebar p-3">
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link active hoverable" href="dashboard.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link hoverable" href="pelanggan.html"><i class="fas fa-users"></i> Pelanggan</a>
        </li>
        <li class="nav-item">
          <a class="nav-link hoverable" href="layanan.html"><i class="fa-solid fa-person-circle-question"></i> Layanan</a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-active" href="order.html"><i class="fa-solid fa-sort"></i> Order</a>
        </li>
        <li class="nav-item">
          <a class="nav-link hoverable" href="laporan.html"><i class="fa-solid fa-chart-line"></i> Laporan</a>
        </li>
      </ul>
    </div>
    <div class="container mt-4">
      <div class="row">
        <div class="col-md-12">
          <div class="card shadowc bg-blur">
            <div class="card-header">
              <div class="d-flex justify-content-between align-items-center">
                <h2 class="font-main-unhover w-60">DATA ORDER</h2>
                <select class="form-select w-25 hoverable font-main fw-bold" aria-label="Default select example">
                  <option selected>Periode Pesanan & Cucian</option>
                  <option value="1">2024</option>
                  <option value="2">2025</option>
                  <option value="3">2026</option>
                </select>
                <button type="button" class="btn font-main hoverable  w-10" data-bs-toggle="modal"
                  data-bs-target="#modalTambahOrder">Tambah Order</button>
              </div>
              <div class="table-responsive">
                <table class="table-bordered table order-table">
                  <thead class="text-center">
                    <tr>
                      <th>No. Order</th>
                      <th>Nama Pelanggan</th>
                      <th>Jenis layanan</th>
                      <th>Berat ( Kg )</th>
                      <th>Total Bayar</th>
                      <th>Status</th>
                      <th>Aksi</th>
                    </tr>
                  </thead>
                  <tbody id="orderTableBody">

                  </tbody>
                </table>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
    </div>
    <div class="modal fade" id="modalTambahOrder" tabindex="-1">

      <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

          <div class="modal-header">
            <h5 class="modal-title font-main">Tambah Orderan SJ WASH</h5>

            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">

            <form id="formTambahOrder">

              <div class="row g-3">

                <div class="col-md-6">
                  <label class="form-label">Nama Pelanggan</label>
                  <input id="namaPelanggan" type="text" class="form-control hoverable" placeholder="Nama pelanggan"
                    required>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Jenis Layanan</label>
                  <select id="jenisLayanan" class="form-select hoverable" required>
                    <option value="" selected disabled>
                      Pilih layanan
                    </option>
                    <option>Cuci Kering</option>
                    <option>Cuci Setrika</option>
                    <option>Setrika</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Berat Cucian (Kg)</label>
                  <input id="beratCucian" type="number" class="form-control hoverable" placeholder="Masukkan berat"
                    min="1" step="0.5" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Tanggal Masuk</label>
                  <input id="tanggalMasuk" type="date" class="form-control hoverable" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Estimasi Selesai</label>
                  <input id="estimasiSelesai" type="date" class="form-control hoverable" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Status Cucian</label>
                  <select id="statusCucian" class="form-select hoverable">
                    <option>Menunggu</option>
                    <option>Diproses</option>
                    <option>Selesai</option>
                    <option>Diambil</option>
                  </select>
                </div>



              </div>

            </form>

          </div>

          <div class="modal-footer">

            <button type="button" class="btn btn-cancel font-cancel" data-bs-dismiss="modal">
              Batal
            </button>

            <button type="submit" form="formTambahOrder" class="btn font-main btn btn-success">
              Simpan Orderan
            </button>

          </div>

        </div>
      </div>
    </div>

    <footer class="footer text-dark text-center py-3 fixed-bottom bg-blur shadowc">
      <div class="container text-muted">
        <small>&copy; 2026 Safe & Joy Wash</small>
      </div>
    </footer>


    <script src="order.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
